name: flutter_boilerplate_data
description: Data implementations, repositories, and datasources for Flutter boilerplate features.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_boilerplate_core:
    path: ../core
  flutter_boilerplate_domain:
    path: ../domain
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  injectable: ^3.0.0
  json_annotation: 4.12.0
  retrofit: ^4.10.0
  shared_preferences: ^2.0.0

dev_dependencies:
  build_runner: ^2.14.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  hive_ce_generator: ^1.11.1
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.0
  mockito: ^5.6.4
  retrofit_generator: ^10.2.9
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
