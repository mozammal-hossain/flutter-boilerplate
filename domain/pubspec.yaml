name: flutter_boilerplate_domain
description: Domain entities, repositories, and usecases for Flutter boilerplate features.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_boilerplate_core:
    path: ../core
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  meta: ^1.17.0

dev_dependencies:
  build_runner: ^2.14.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
