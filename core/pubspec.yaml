name: flutter_boilerplate_core
description: Core utilities, failures, extensions, theme, and constants for Flutter boilerplate.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  bloc: ^9.2.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_boilerplate_data:
    path: ../data
  flutter_boilerplate_domain:
    path: ../domain
  flutter_screenutil: ^5.9.0
  get_it: ^9.3.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  injectable: ^3.0.0
  intl: ^0.20.3
  logger: ^2.8.0
  shared_preferences: ^2.0.0

dev_dependencies:
  build_runner: ^2.14.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
